android.useAndroidX=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.suppressUnsupportedCompileSdk=37.0
android.dependency.agpMinVersionCheck=false
# KSP still registers generated sources via the legacy kotlin.sourceSets DSL, which AGP 9's
# built-in Kotlin support rejects by default. This is the suppression AGP itself recommends
# for that exact error (see https://developer.android.com/r/tools/built-in-kotlin) until KSP
# adopts the new android.sourceSets/Sources API.
android.disallowKotlinSourceSets=false
